services:
  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-8}
    ports:
      - "5000:5000"
